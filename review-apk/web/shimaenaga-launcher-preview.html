<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191B">
  <title>Merzkava Pocket — Shimaenaga Launcher Icon</title>
  <link rel="stylesheet" href="./shimaenaga-launcher-preview.css">
</head>
<body>
  <main class="sheet">
    <p class="eyebrow">MERZKAVA POCKET · SHIMAENAGA</p>
    <div class="icon" role="img" aria-label="CSS silhouette of a white long-tailed tit with a visible wing and long tapered tail">
      <span class="bird" aria-hidden="true">
        <i class="tail tail-back"></i>
        <i class="tail tail-front"></i>
        <i class="body"></i>
        <i class="head"></i>
        <i class="crown"></i>
        <i class="wing"></i>
        <i class="wing-crease"></i>
        <i class="eye"></i>
        <i class="beak"></i>
        <i class="foot foot-a"></i>
        <i class="foot foot-b"></i>
        <i class="spark"></i>
      </span>
    </div>
    <div class="small-check">
      <span>SMALL-SIZE CHECK</span>
      <div class="icon small" role="img" aria-label="The same bird silhouette at 64 pixels">
        <span class="bird" aria-hidden="true">
          <i class="tail tail-back"></i><i class="tail tail-front"></i>
          <i class="body"></i><i class="head"></i><i class="crown"></i>
          <i class="wing"></i><i class="wing-crease"></i><i class="eye"></i>
          <i class="beak"></i><i class="foot foot-a"></i><i class="foot foot-b"></i><i class="spark"></i>
        </span>
      </div>
    </div>
    <p class="caption">A plump white Shimaenaga, facing right, with a clearly separated long tail and visible wing. The CSS study is mirrored in the native Android launcher vector.</p>
  </main>
</body>
</html>
