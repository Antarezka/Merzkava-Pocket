<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191b">
  <title>Merzkava Pocket — Shimaenaga Icon Study</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #17191b;
      --gold: #d0ad72;
      --ivory: #f1ebdd;
      --snow: #fffdf7;
      --warm: #e9d9c3;
      --slate: #aaaeb0;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      color: var(--ivory);
      background:
        radial-gradient(ellipse at 50% 35%, #29322e 0, #171d1b 43%, #0d100f 100%);
      font-family: Georgia, "Times New Roman", serif;
    }

    .study {
      width: min(100%, 440px);
      display: grid;
      justify-items: center;
      gap: 22px;
      text-align: center;
    }

    .eyebrow {
      color: var(--gold);
      font: 600 10px/1.4 system-ui, sans-serif;
      letter-spacing: .24em;
    }

    .icon-stage {
      width: min(68vw, 260px);
      aspect-ratio: 1;
      position: relative;
      display: grid;
      place-items: center;
    }

    .app-icon {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 1px solid #d0ad72;
      border-radius: 27%;
      background:
        radial-gradient(circle at 50% 44%, #354039 0, #202824 48%, #141817 100%);
      box-shadow:
        0 22px 54px #0009,
        inset 0 1px 0 #fff2,
        inset 0 -12px 28px #0006;
      isolation: isolate;
    }

    .app-icon::before {
      content: "";
      position: absolute;
      inset: 7px;
      border: 1px solid #d0ad724a;
      border-radius: 24%;
      pointer-events: none;
    }

    .app-icon::after {
      content: "";
      position: absolute;
      width: 72%;
      height: 62%;
      left: 14%;
      top: 18%;
      border-radius: 50%;
      background: #f5e8cf18;
      filter: blur(24px);
      pointer-events: none;
    }

    .bird {
      position: absolute;
      z-index: 1;
      inset: 10%;
      filter: drop-shadow(0 5px 5px #05080777);
    }

    /* Long, split tail: deliberately extends beyond the round body. */
    .tail {
      position: absolute;
      left: 0%;
      top: 68%;
      width: 47%;
      height: 12%;
      transform: rotate(-37deg);
      transform-origin: 100% 50%;
      clip-path: polygon(100% 0, 96% 48%, 0 100%, 13% 40%);
      border-radius: 50%;
    }

    .tail-light {
      background: linear-gradient(180deg, #f7f1e5 0%, #d4d0c6 100%);
    }

    .tail-dark {
      z-index: 1;
      left: 4%;
      top: 74%;
      width: 43%;
      height: 5%;
      background: linear-gradient(90deg, #30383a, #697174 76%, #31383a);
    }

    .tail-tip {
      z-index: 2;
      left: 1%;
      top: 68%;
      width: 15%;
      height: 5%;
      background: #343b3d;
      opacity: .9;
    }

    .body {
      position: absolute;
      left: 25%;
      top: 32%;
      width: 62%;
      height: 57%;
      border-radius: 49% 51% 48% 52% / 48% 46% 54% 52%;
      background:
        radial-gradient(ellipse at 34% 25%, #fff 0 16%, transparent 46%),
        linear-gradient(145deg, #fffef9 4%, #f4eee2 62%, #d9d5cb 100%);
      box-shadow: inset -7px -8px 12px #a8a39a33;
    }

    .head {
      position: absolute;
      left: 49%;
      top: 11%;
      width: 43%;
      height: 44%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 27%, #fff 0 12%, transparent 47%),
        linear-gradient(145deg, #fffefb 0%, #f5f0e6 75%, #e1dcd1 100%);
      box-shadow: inset -4px -4px 8px #aaa49a22;
    }

    .fluff {
      position: absolute;
      left: 55%;
      top: 8%;
      width: 18%;
      height: 10%;
      border-radius: 70% 35% 70% 30%;
      transform: rotate(-24deg);
      background: #fffdf7;
    }

    /* The wing is a separate, high-contrast shape so it stays readable when small. */
    .wing {
      position: absolute;
      z-index: 2;
      left: 34%;
      top: 51%;
      width: 39%;
      height: 29%;
      border-radius: 58% 46% 53% 42%;
      transform: rotate(-24deg);
      clip-path: polygon(7% 17%, 32% 0, 72% 10%, 100% 53%, 72% 83%, 36% 100%, 0 70%);
      background: linear-gradient(145deg, #e9dfd1 0%, #c7c4bc 55%, #9da3a1 100%);
      box-shadow: inset 3px 3px 5px #fff8;
    }

    .wing-feather {
      position: absolute;
      z-index: 3;
      left: 43%;
      top: 62%;
      width: 24%;
      height: 5%;
      border-radius: 100%;
      transform: rotate(-25deg);
      background: #f5eee3;
      opacity: .9;
    }

    .wing-feather.second {
      left: 40%;
      top: 69%;
      width: 22%;
      height: 4%;
      background: #aeb0aa;
      opacity: .8;
    }

    .eye {
      position: absolute;
      z-index: 4;
      left: 82%;
      top: 29%;
      width: 3.8%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #17191b;
      box-shadow: 0 0 0 1px #fff7, 0 1px 2px #0008;
    }

    .beak {
      position: absolute;
      z-index: 4;
      left: 92%;
      top: 35%;
      width: 7%;
      height: 5%;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
      background: #c98555;
    }

    .cheek {
      position: absolute;
      z-index: 3;
      left: 76%;
      top: 39%;
      width: 12%;
      height: 6%;
      border-radius: 50%;
      background: #e9c5a8;
      opacity: .42;
      filter: blur(2px);
    }

    .caption {
      display: grid;
      gap: 7px;
    }

    .caption strong {
      color: var(--ivory);
      font-size: 17px;
      font-weight: 500;
      letter-spacing: .025em;
    }

    .caption span {
      color: #b8b6aa;
      font: 10px/1.65 system-ui, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .small-preview {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 2px;
      color: #aaa99f;
      font: 10px/1.4 system-ui, sans-serif;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .small-icon {
      width: 62px;
      height: 62px;
      flex: 0 0 62px;
      border-radius: 27%;
    }

    @media (max-width: 360px) {
      .icon-stage { width: min(72vw, 240px); }
      .caption strong { font-size: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="study">
    <div class="eyebrow">MERZKAVA POCKET · ICON STUDY 01</div>

    <div class="icon-stage">
      <div class="app-icon" role="img" aria-label="CSS silhouette of a fluffy white Shimaenaga bird with a visible wing and long split tail.">
        <div class="bird" aria-hidden="true">
          <i class="tail tail-light"></i>
          <i class="tail tail-dark"></i>
          <i class="tail tail-tip"></i>
          <i class="body"></i>
          <i class="head"></i>
          <i class="fluff"></i>
          <i class="wing"></i>
          <i class="wing-feather"></i>
          <i class="wing-feather second"></i>
          <i class="cheek"></i>
          <i class="eye"></i>
          <i class="beak"></i>
        </div>
      </div>
    </div>

    <div class="caption">
      <strong>Shimaenaga · Snow Fairy</strong>
      <span>Fluffy body · visible wing · long split tail</span>
    </div>

    <div class="small-preview">
      <div class="app-icon small-icon" role="img" aria-label="Small-size icon legibility preview.">
        <div class="bird" aria-hidden="true">
          <i class="tail tail-light"></i>
          <i class="tail tail-dark"></i>
          <i class="tail tail-tip"></i>
          <i class="body"></i>
          <i class="head"></i>
          <i class="fluff"></i>
          <i class="wing"></i>
          <i class="wing-feather"></i>
          <i class="wing-feather second"></i>
          <i class="cheek"></i>
          <i class="eye"></i>
          <i class="beak"></i>
        </div>
      </div>
      <span>Small launcher-size check</span>
    </div>
  </main>
</body>
</html>
