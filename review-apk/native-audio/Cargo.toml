[package]
name = "pocket-audio"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "pocket_audio"
crate-type = ["cdylib"]

[dependencies]
oxiaudio = { version = "0.2.1", default-features = true }
# Enable the optional pure-Rust OGG Opus decoder as Pocket also accepts .opus imports.
oxiaudio-decode = { version = "0.2.1", features = ["opus"] }
oxisound = { version = "0.2.1", default-features = true }
ringbuf = "0.5.1"
jni = "0.21.1"
ndk-context = "0.1.1"
serde_json = "1.0"
