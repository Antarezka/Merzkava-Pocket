name: Merzkava Pocket Android APK
on:
  push:
    branches: [main, feat/daily-login-pixel-scene-frame11-mainline, fix/daily-login-japanese-shop-depth-2026-11-08, feat/claude-modular-appearance-expansion-2026-11-08, recovery/claude-full-updates-on-build-146-2026-11-09, feat/settings-vinyl-player-2026-11-09, fix/build196-vinyl-ambience-loader-2026-11-09, feat/role-based-profile-databased-toolbar-2026-11-09, fix/build239-manual-audio-floating-fox-splash]
    paths:
      - "review-apk/**"
      - "docs/game/**"
      - "signing/**"
      - ".github/workflows/pocket-design-review-apk.yml"
      # Included so repository-driven rebuilds can be triggered after encrypted key provisioning.
  workflow_dispatch:
  # Rebuild after removing the Yuma/Fox character integration.
permissions:
  contents: write
concurrency:
  group: merzkava-pocket-apk-cri-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true
      - name: Install Android SDK platform, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          NDK_DIR="$SDK_ROOT/ndk/27.2.12479018"
          for attempt in 1 2 3; do
            echo "Android SDK install attempt $attempt/3"
            if sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018" &&
               test -s "$NDK_DIR/source.properties"; then
              break
            fi
            echo "SDK package install was incomplete; removing partial NDK download before retry."
            rm -rf "$NDK_DIR" "$SDK_ROOT/.temp" "$SDK_ROOT/temp"
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Android NDK 27.2.12479018 could not be installed after three clean attempts."
              exit 1
            fi
            sleep 5
          done
          test -s "$NDK_DIR/source.properties"
          grep -q "Pkg.Revision = 27.2.12479018" "$NDK_DIR/source.properties"
      - name: Download and verify the private CRI ADX LE SDK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CRI_SDK_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::CRI_SDK_READ_TOKEN is required to download the private CRI SDK."
            exit 1
          fi
          SDK_DIR="$RUNNER_TEMP/cri-sdk"
          mkdir -p "$SDK_DIR"
          gh release download cri-sdk-temp \
            --repo Antarezka/open-innovation-lab \
            --pattern "cri_adx2le_sdk_v2.31.01.zip" \
            --dir "$SDK_DIR" --clobber
          ZIP="$SDK_DIR/cri_adx2le_sdk_v2.31.01.zip"
          EXPECTED="a8996d1096ecab760c1fedd5a32a7bcb5013c1894bd555d19c6b33f765ccc5b4"
          echo "$EXPECTED  $ZIP" | sha256sum --check -
          mkdir -p "$SDK_DIR/unpacked"
          unzip -q "$ZIP" -d "$SDK_DIR/unpacked"
          echo "Inspecting CRI SDK Android package layout (paths only):"
          find "$SDK_DIR/unpacked" -type f \( -iname 'libcri_ware_android*le.so' -o -name 'cri_le_atom_android.h' -o -name 'cri_le_atom_ex.h' \) -print | sort
          ARM64_LIB="$(find "$SDK_DIR/unpacked" -type f -iname 'libcri_ware_android*le.so' | grep -E '/arm64-v8a/' | head -n1)"
          ARM32_LIB="$(find "$SDK_DIR/unpacked" -type f -iname 'libcri_ware_android*le.so' | grep -E '/armeabi-v7a/' | head -n1)"
          HEADER_DIR="$(find "$SDK_DIR/unpacked" -type f -name 'cri_le_atom_android.h' -printf '%h\n' | head -n1)"
          test -n "$ARM64_LIB" && test -s "$ARM64_LIB"
          test -n "$ARM32_LIB" && test -s "$ARM32_LIB"
          test -n "$HEADER_DIR" && test -s "$HEADER_DIR/cri_le_atom_ex.h"
          CRI_ROOT="$SDK_DIR/normalized"
          mkdir -p "$CRI_ROOT/include" "$CRI_ROOT/libs/arm64-v8a" "$CRI_ROOT/libs/armeabi-v7a"
          cp -a "$HEADER_DIR/." "$CRI_ROOT/include/"
          cp "$ARM64_LIB" "$CRI_ROOT/libs/arm64-v8a/libcri_ware_android_le.so"
          cp "$ARM32_LIB" "$CRI_ROOT/libs/armeabi-v7a/libcri_ware_android_LE.so"
          mkdir -p review-apk/app/src/main/jniLibs/arm64-v8a review-apk/app/src/main/jniLibs/armeabi-v7a
          cp "$CRI_ROOT/libs/arm64-v8a/libcri_ware_android_le.so" review-apk/app/src/main/jniLibs/arm64-v8a/
          cp "$CRI_ROOT/libs/armeabi-v7a/libcri_ware_android_LE.so" review-apk/app/src/main/jniLibs/armeabi-v7a/
          echo "CRI_SDK_ROOT=$CRI_ROOT" >> "$GITHUB_ENV"
          echo "Verified and normalized CRI ADX LE 2.31.01 Android libraries and headers for ARM64 and ARMv7."

      - name: Ensure FFmpeg with ADX encoder is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! ffmpeg -hide_banner -encoders 2>/dev/null | grep -q "adpcm_adx"; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -encoders | grep -q "adpcm_adx"
      - name: Install web dependencies
        working-directory: review-apk
        run: npm install
      - name: Restore Pocket music sources and encode every sound for CRI
        shell: bash
        run: |
          set -euo pipefail
          AUDIO_DIR="review-apk/web/public/audio"
          CRI_AUDIO_DIR="review-apk/web/public/cri-audio"
          mkdir -p "$AUDIO_DIR" "$CRI_AUDIO_DIR"
          git show "origin/chore/pocket-audio-folder-2026-11-09:review-apk/web/public/audio/Happy-1a.ogg" > "$AUDIO_DIR/Happy-1a.ogg"
          git show "origin/chore/pocket-audio-folder-2026-11-09:review-apk/web/public/audio/chill-1a.ogg" > "$AUDIO_DIR/chill-1a.ogg"
          git show "origin/chore/pocket-audio-folder-2026-11-09:review-apk/web/public/audio/Retroatrical-a1.ogg" > "$AUDIO_DIR/Retroatrical-1.ogg"
          git show "origin/chore/pocket-audio-folder-2026-11-09:review-apk/web/public/audio/Retroatrical-2.ogg" > "$AUDIO_DIR/Retroatrical-2.ogg"
          git show "origin/feat/settings-vinyl-player-2026-11-09:review-apk/web/public/audio/vinyl-surface-noise.ogg" > "$AUDIO_DIR/vinyl-surface-noise.ogg"
          git show "origin/chore/pocket-audio-folder-2026-11-09:review-apk/web/public/audio/needle drop+vinyls crackle.mp3" > "$AUDIO_DIR/needle drop+vinyls crackle.mp3"
          git show "origin/chore/pocket-audio-folder-2026-11-09:review-apk/web/public/audio/record placement.mp3" > "$AUDIO_DIR/record placement.mp3"
          python3 - <<'PY'
          import math
          import random
          import struct
          import wave

          RATE = 44100

          def write_wav(path, samples):
              with wave.open(path, "wb") as out:
                  out.setnchannels(1)
                  out.setsampwidth(2)
                  out.setframerate(RATE)
                  pcm = bytearray()
                  for sample in samples:
                      value = max(-1.0, min(1.0, sample))
                      pcm.extend(struct.pack("<h", int(round(value * 32767.0))))
                  out.writeframes(pcm)

          # Door slide: a soft filtered-noise sweep followed by three descending bell partials.
          duration = 0.98
          count = int(RATE * duration)
          rng = random.Random(20261110)
          samples = []
          filtered = 0.0
          phases = [0.0, 0.0, 0.0]
          bells = [
              (1318.5, 0.350, 0.043, 0.480),
              (1760.0, 0.390, 0.025, 0.580),
              (2093.0, 0.430, 0.012, 0.550),
          ]
          for i in range(count):
              t = i / RATE
              noise = 0.0
              if t < 0.54:
                  cutoff = 1700.0 * ((390.0 / 1700.0) ** min(1.0, t / 0.50))
                  alpha = 1.0 - math.exp(-2.0 * math.pi * cutoff / RATE)
                  filtered += alpha * (rng.random() * 2.0 - 1.0 - filtered)
                  noise = 0.055 * (1.0 - t / 0.54) * filtered
              tone = 0.0
              for index, (frequency, start, level, length) in enumerate(bells):
                  local = t - start
                  if 0.0 <= local <= length:
                      instantaneous = frequency * ((0.72) ** (local / length))
                      phases[index] += 2.0 * math.pi * instantaneous / RATE
                      attack = min(1.0, local / 0.018)
                      tone += level * attack * math.exp(-12.6 * local) * math.sin(phases[index])
              samples.append(noise + tone)
          write_wav("review-apk/web/public/audio/door-chime.wav", samples)

          # Door rattle: three short, low triangle-wave taps with staggered attacks.
          duration = 0.25
          count = int(RATE * duration)
          taps = [(155.0, 0.000, 0.018, 0.085), (112.0, 0.035, 0.011, 0.105), (205.0, 0.090, 0.007, 0.070)]
          phases = [0.0, 0.0, 0.0]
          samples = []
          for i in range(count):
              t = i / RATE
              value = 0.0
              for index, (frequency, start, level, length) in enumerate(taps):
                  local = t - start
                  if 0.0 <= local <= length:
                      phases[index] += 2.0 * math.pi * frequency / RATE
                      triangle = (2.0 / math.pi) * math.asin(math.sin(phases[index]))
                      attack = min(1.0, local / 0.008)
                      decay = math.exp(-math.log(max(1.0, level / 0.0001)) * local / length)
                      value += level * attack * decay * triangle
              samples.append(value)
          write_wav("review-apk/web/public/audio/door-rattle.wav", samples)
          PY
          declare -A INPUTS=(
            ["Happy-1a.adx"]="$AUDIO_DIR/Happy-1a.ogg"
            ["chill-1a.adx"]="$AUDIO_DIR/chill-1a.ogg"
            ["Retroatrical-1.adx"]="$AUDIO_DIR/Retroatrical-1.ogg"
            ["Retroatrical-2.adx"]="$AUDIO_DIR/Retroatrical-2.ogg"
            ["needle-drop.adx"]="$AUDIO_DIR/needle drop+vinyls crackle.mp3"
            ["record-placement.adx"]="$AUDIO_DIR/record placement.mp3"
            ["vinyl-surface-noise.adx"]="$AUDIO_DIR/vinyl-surface-noise.ogg"
            ["door-chime.adx"]="$AUDIO_DIR/door-chime.wav"
            ["door-rattle.adx"]="$AUDIO_DIR/door-rattle.wav"
          )
          for output in "${!INPUTS[@]}"; do
            input="${INPUTS[$output]}"
            test -s "$input"
            ffmpeg -y -hide_banner -loglevel error -i "$input" -map 0:a:0 -vn -c:a adpcm_adx -f adx "$CRI_AUDIO_DIR/$output"
            test -s "$CRI_AUDIO_DIR/$output"
            format="$(ffprobe -v error -show_entries format=format_name -of default=noprint_wrappers=1:nokey=1 "$CRI_AUDIO_DIR/$output")"
            grep -qi "adx" <<< "$format"
            echo "$output <- $(basename "$input") | $(stat -c%s "$CRI_AUDIO_DIR/$output") bytes"
          done
          test "$(find "$CRI_AUDIO_DIR" -maxdepth 1 -type f -name '*.adx' | wc -l)" -eq 9

      - name: Run Pocket test suite
        working-directory: review-apk
        run: npm test
      - name: Verify native-only CRI audio sources and converted assets
        shell: bash
        run: |
          set -euo pipefail
          test -s review-apk/web/src/audio-player.js
          if grep -R -n -E "new[[:space:]]+Audio[[:space:]]*\(|AudioContext|webkitAudioContext|canPlayType|createElement[^;]*audio|<audio" review-apk/web/src review-apk/web/public; then
            echo "::error::A WebView/browser audio playback path remains. All BGM and FX must go through PocketCriAudioRuntime."
            exit 1
          fi
          if grep -R -n -E "playPocketAudio|playPocketSound|startPocketAmbience|pausePocketAudio|stopPocketAudio|setPocketAudioVolume" review-apk/web/src --exclude=audio-player.js; then
            echo "::error::An app module bypasses the centralized Pocket audio controller."
            exit 1
          fi
          if grep -R -n -E "\\b(MediaPlayer|SoundPool|AudioTrack|MediaRecorder)\\b" review-apk/app/src/main/java; then
            echo "::error::A second Android playback engine was found. CRI AtomEx must own all audio output."
            exit 1
          fi
          if grep -R -n -E "(this|scene|game)\\.sound\\.(play|add)|new[[:space:]]+Phaser\\.Sound" review-apk/web/src; then
            echo "::error::A Phaser sound path bypasses the CRI audio handler."
            exit 1
          fi
          for asset in Happy-1a.adx chill-1a.adx Retroatrical-1.adx Retroatrical-2.adx needle-drop.adx record-placement.adx vinyl-surface-noise.adx door-chime.adx door-rattle.adx; do
            test -s "review-apk/web/public/cri-audio/$asset"
          done
          grep -q 'PocketCriAudioRuntime' review-apk/app/src/main/java/com/merzkava/pocket/review/PocketNativeBridge.java
          grep -q 'PocketAudioImporter' review-apk/app/src/main/java/com/merzkava/pocket/review/PocketNativeBridge.java
          grep -q 'CHANNEL_MUSIC' review-apk/app/src/main/java/com/merzkava/pocket/review/PocketCriAudioRuntime.java
          grep -q 'CHANNEL_AMBIENCE' review-apk/app/src/main/java/com/merzkava/pocket/review/PocketCriAudioRuntime.java
          grep -q 'CHANNEL_NEEDLE' review-apk/app/src/main/java/com/merzkava/pocket/review/PocketCriAudioRuntime.java
          grep -q 'CHANNEL_EFFECTS' review-apk/app/src/main/java/com/merzkava/pocket/review/PocketCriAudioRuntime.java
          grep -q 'CHANNEL_DOOR_CHIME' review-apk/app/src/main/java/com/merzkava/pocket/review/PocketCriAudioRuntime.java
          grep -q 'CHANNEL_DOOR_RATTLE' review-apk/app/src/main/java/com/merzkava/pocket/review/PocketCriAudioRuntime.java
          grep -q 'kChannelCount = 6' review-apk/app/src/main/cpp/cri_audio_jni.cpp
          test -s review-apk/app/src/main/cpp/cri_audio_jni.cpp
          grep -q "criAtomEx_ExecuteMain" review-apk/app/src/main/cpp/cri_audio_jni.cpp
          grep -q "gServerRunning" review-apk/app/src/main/cpp/cri_audio_jni.cpp
          test -s review-apk/app/src/main/cpp/CMakeLists.txt
          echo "Verified: one CRI AtomEx runtime routes BGM, imported music, ambience and every registered FX channel."
      - name: Build Pocket web shell
        working-directory: review-apk
        run: npm run build
      - name: Remove source audio from web distribution
        shell: bash
        run: |
          set -euo pipefail
          rm -rf review-apk/dist/audio
          test "$(find review-apk/dist/cri-audio -maxdepth 1 -type f -name '*.adx' | wc -l)" -eq 9
      - name: Render CSS launcher icon with Takumi
        working-directory: review-apk
        run: npm run render:launcher-icon
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Pocket Java and native CRI source
        working-directory: review-apk
        run: gradle --no-daemon :app:externalNativeBuildDebug :app:compileDebugJavaWithJavac
      - name: Set version and artifact identity
        shell: bash
        run: |
          set -euo pipefail
          HASH="$(git rev-parse --short=7 "$GITHUB_SHA")"
          BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          ARTIFACT_NAME="Merzkava-Pocket-Build-${BUILD_NUMBER}-${HASH}"
          {
            echo "POCKET_VERSION=v.0.01.007-${HASH}"
            echo "POCKET_BUILD_NUMBER=${BUILD_NUMBER}"
            echo "POCKET_COMMIT=${HASH}"
            echo "POCKET_ARTIFACT_NAME=${ARTIFACT_NAME}"
          } >> "$GITHUB_ENV"
      - name: Prepare persistent Pocket signing key
        shell: bash
        env:
          POCKET_SIGNING_PASSWORD: ${{ secrets.POCKET_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$POCKET_SIGNING_PASSWORD" ]]; then
            echo "::error::Add the POCKET_SIGNING_PASSWORD GitHub Actions secret."
            exit 1
          fi
          if [[ ! -f "signing/merzkava-pocket-upload.jks.gpg" ]]; then
            echo "::error::The encrypted Pocket signing key is missing. Run the 'Create Pocket signing key' workflow first."
            exit 1
          fi
          PASSPHRASE_FILE="$RUNNER_TEMP/pocket-keystore-passphrase"
          KEYSTORE_FILE="$RUNNER_TEMP/merzkava-pocket-upload.jks"
          umask 077
          printf '%s' "$POCKET_SIGNING_PASSWORD" > "$PASSPHRASE_FILE"
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$PASSPHRASE_FILE" --decrypt --output "$KEYSTORE_FILE" "signing/merzkava-pocket-upload.jks.gpg"
          rm -f "$PASSPHRASE_FILE"
          test -s "$KEYSTORE_FILE"
          keytool -list -keystore "$KEYSTORE_FILE" -storetype JKS -storepass "$POCKET_SIGNING_PASSWORD" -alias "merzkava-pocket-upload" >/dev/null
          keytool -certreq -alias "merzkava-pocket-upload" -keystore "$KEYSTORE_FILE" -storetype JKS -storepass "$POCKET_SIGNING_PASSWORD" -keypass "$POCKET_SIGNING_PASSWORD" -file "$RUNNER_TEMP/pocket-signing-check.csr" >/dev/null 2>&1
          rm -f "$RUNNER_TEMP/pocket-signing-check.csr"
          {
            echo "POCKET_KEYSTORE_PATH=$KEYSTORE_FILE"
            echo "POCKET_KEY_ALIAS=merzkava-pocket-upload"
          } >> "$GITHUB_ENV"
      - name: Build Android APK
        working-directory: review-apk
        env:
          POCKET_KEYSTORE_PATH: ${{ env.POCKET_KEYSTORE_PATH }}
          POCKET_STORE_PASSWORD: ${{ secrets.POCKET_SIGNING_PASSWORD }}
          POCKET_KEY_ALIAS: ${{ env.POCKET_KEY_ALIAS }}
          POCKET_KEY_PASSWORD: ${{ secrets.POCKET_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug -PpocketVersion="$POCKET_VERSION" -PpocketVersionCode="$((10000 + GITHUB_RUN_NUMBER))"
      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="review-apk/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.merzkava.pocket'"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libcri_ware_android_le.so"
          unzip -l "$APK" | grep -F "lib/armeabi-v7a/libcri_ware_android_LE.so"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libpocket_cri_audio.so"
          for asset in Happy-1a.adx chill-1a.adx Retroatrical-1.adx Retroatrical-2.adx needle-drop.adx record-placement.adx vinyl-surface-noise.adx door-chime.adx door-rattle.adx; do
            unzip -l "$APK" | grep -F "assets/cri-audio/$asset"
          done
          if unzip -l "$APK" | grep -E 'assets/audio/.*\.(ogg|mp3|m4a|aac|flac)$'; then
            echo "::error::Compressed source audio must not be routed through the WebView asset folder."
            exit 1
          fi
      - name: Rename APK
        run: |
          mkdir -p dist
          cp review-apk/app/build/outputs/apk/debug/app-debug.apk "dist/$POCKET_ARTIFACT_NAME.apk"
          test -s dist/merzkava-pocket-shimaenaga.ico
          test -s dist/merzkava-pocket-shimaenaga.png
          ls -lh dist
      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/merzkava-pocket-upload.jks" "$RUNNER_TEMP/pocket-keystore-passphrase" "$RUNNER_TEMP/pocket-signing-check.csr"
          rm -rf "$RUNNER_TEMP/cri-sdk"

      - name: Publish public Pocket update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="dist/$POCKET_ARTIFACT_NAME.apk"
          TAG="pocket-build-$POCKET_BUILD_NUMBER"
          MANIFEST_PATH="dist/pocket-update.json"
          NOTES_PATH="dist/pocket-release-notes.md"
          PREVIOUS_TAG="$(git tag --list 'pocket-build-*' --sort=-version:refname | head -n1)"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            NOTES_JSON="$(git log "$PREVIOUS_TAG..$GITHUB_SHA" --pretty=format:%s | jq -Rsc 'split("\n") | map(select(length > 0))')"
          else
            NOTES_JSON="$(git log -n 12 "$GITHUB_SHA" --pretty=format:%s | jq -Rsc 'split("\n") | map(select(length > 0))')"
          fi
          if [[ "$NOTES_JSON" == "[]" ]]; then
            NOTES_JSON='["Maintenance and compatibility updates for Merzkava Pocket."]'
          fi
          APK_SIZE="$(stat -c%s "$APK_PATH")"
          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          DOWNLOAD_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$POCKET_ARTIFACT_NAME.apk"
          jq -n \
            --arg packageName "com.merzkava.pocket" \
            --arg tag "$TAG" \
            --arg versionName "$POCKET_VERSION" \
            --arg commit "$POCKET_COMMIT" \
            --arg apkName "$POCKET_ARTIFACT_NAME.apk" \
            --arg downloadUrl "$DOWNLOAD_URL" \
            --arg sha256 "$APK_SHA256" \
            --argjson buildNumber "$POCKET_BUILD_NUMBER" \
            --argjson apkSizeBytes "$APK_SIZE" \
            --argjson notes "$NOTES_JSON" \
            '{packageName:$packageName,tag:$tag,buildNumber:$buildNumber,versionName:$versionName,commit:$commit,apkName:$apkName,downloadUrl:$downloadUrl,apkSizeBytes:$apkSizeBytes,sha256:$sha256,notes:$notes}' \
            > "$MANIFEST_PATH"
          {
            echo "## Merzkava Pocket Build #$POCKET_BUILD_NUMBER"
            echo
            echo "- Version: $POCKET_VERSION"
            echo "- Commit: $POCKET_COMMIT"
            echo "- APK size: $(numfmt --to=iec-i --suffix=B "$APK_SIZE")"
            echo "- SHA-256: `$APK_SHA256`"
            echo
            echo "### What's new"
            printf '%s' "$NOTES_JSON" | jq -r '.[] | "- " + .'
            echo
            echo "The APK is signed with the persistent Merzkava Pocket release key."
          } > "$NOTES_PATH"
          gh release create "$TAG" "$APK_PATH" "$MANIFEST_PATH" \
            --title "Merzkava Pocket Build #$POCKET_BUILD_NUMBER" \
            --notes-file "$NOTES_PATH" \
            --latest
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.POCKET_ARTIFACT_NAME }}
          path: |
            dist/${{ env.POCKET_ARTIFACT_NAME }}.apk
            dist/merzkava-pocket-shimaenaga.ico
            dist/merzkava-pocket-shimaenaga.png
          if-no-files-found: error
          retention-days: 30

