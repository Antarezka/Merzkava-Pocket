name: Merzkava Pocket Android APK
on:
  push:
    branches: [main]
    paths:
      - "review-apk/**"
      - "docs/game/**"
      - ".github/workflows/pocket-design-review-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true
      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Install web dependencies
        working-directory: review-apk
        run: npm install
      - name: Build Pocket web shell
        working-directory: review-apk
        run: npm run build
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Pocket Android source
        working-directory: review-apk
        run: gradle --no-daemon :app:compileDebugJavaWithJavac
      - name: Set version
        shell: bash
        run: |
          HASH="$(git rev-parse --short=4 "$GITHUB_SHA")"
          echo "POCKET_VERSION=v.0.01.007-$HASH" >> "$GITHUB_ENV"
      - name: Prepare persistent Pocket signing key
        shell: bash
        env:
          POCKET_KEYSTORE_BASE64: ${{ secrets.POCKET_KEYSTORE_BASE64 || secrets.MERZKAVA_KEYSTORE_BASE64 }}
          POCKET_STORE_PASSWORD: ${{ secrets.POCKET_STORE_PASSWORD || secrets.MERZKAVA_KEYSTORE_PASSWORD }}
          POCKET_KEY_ALIAS: ${{ secrets.POCKET_KEY_ALIAS || secrets.MERZKAVA_KEY_ALIAS }}
          POCKET_KEY_PASSWORD: ${{ secrets.POCKET_KEY_PASSWORD || secrets.MERZKAVA_KEY_PASSWORD }}
        run: |
          if [[ -z "$POCKET_KEYSTORE_BASE64" || -z "$POCKET_STORE_PASSWORD" || -z "$POCKET_KEY_ALIAS" || -z "$POCKET_KEY_PASSWORD" ]]; then
            echo "::error::Persistent Pocket signing is not configured. Add all four POCKET_* GitHub Actions secrets before building."
            exit 1
          fi
          printf '%s' "$POCKET_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/merzkava-pocket-upload.jks"
          test -s "$RUNNER_TEMP/merzkava-pocket-upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/merzkava-pocket-upload.jks" -storepass "$POCKET_STORE_PASSWORD" -alias "$POCKET_KEY_ALIAS" >/dev/null
          echo "POCKET_KEYSTORE_PATH=$RUNNER_TEMP/merzkava-pocket-upload.jks" >> "$GITHUB_ENV"
      - name: Build Android APK
        working-directory: review-apk
        env:
          POCKET_KEYSTORE_PATH: ${{ env.POCKET_KEYSTORE_PATH }}
          POCKET_STORE_PASSWORD: ${{ secrets.POCKET_STORE_PASSWORD }}
          POCKET_KEY_ALIAS: ${{ secrets.POCKET_KEY_ALIAS }}
          POCKET_KEY_PASSWORD: ${{ secrets.POCKET_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug -PpocketVersion="$POCKET_VERSION" -PpocketVersionCode="$((10000 + GITHUB_RUN_NUMBER))"
      - name: Verify APK package and signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "review-apk/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "review-apk/app/build/outputs/apk/debug/app-debug.apk" | grep -F "package: name='com.merzkava.pocket'"
      - name: Rename APK
        run: |
          mkdir -p dist
          cp review-apk/app/build/outputs/apk/debug/app-debug.apk "dist/Merzkava-Pocket-$POCKET_VERSION.apk"
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: Merzkava-Pocket-Android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
