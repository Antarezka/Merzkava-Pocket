name: Merzkava Pocket Design Review APK
on:
  push:
    branches: [main]
    paths: ["review-apk/**", ".github/workflows/pocket-design-review-apk.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set version
        shell: bash
        run: |
          HASH="$(git rev-parse --short=4 "$GITHUB_SHA")"
          echo "POCKET_VERSION=v.0.01.001-$HASH" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: review-apk
        run: gradle --no-daemon :app:assembleDebug -PpocketVersion="$POCKET_VERSION"
      - name: Rename APK
        run: |
          mkdir -p dist
          cp review-apk/app/build/outputs/apk/debug/app-debug.apk "dist/Merzkava-Pocket-$POCKET_VERSION.apk"
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: Merzkava-Pocket-Design-Review
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
