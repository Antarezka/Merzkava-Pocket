name: Merzkava Pocket Repair Tests

on:
  push:
    branches: [fix/build362-audio-update-2026-11-11, fix/settings-updater-downloadmanager-build375-2026-11-11, fix/pocket-cri-native-renderer-2026-11-11, fix/build378-cri-default-renderer-2026-11-11, fix/build379-cri-distortion-2026-11-11]
    paths:
      - "review-apk/**"
      - ".github/workflows/pocket-repair-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocket-repair-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Pocket test dependencies
        working-directory: review-apk
        run: npm install
      - name: Check changed JavaScript syntax
        working-directory: review-apk
        run: |
          node --check web/src/main.js
          node --check test/audio-settings-mount.test.js
      - name: Run Pocket unit and source-contract tests
        working-directory: review-apk
        run: npm test
      - name: Decode bundled chill-1a and compare PCM against an independent ADX decoder
        working-directory: review-apk
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$PWD/web/public/cri-audio/chill-1a.adx"
          OUTPUT="$RUNNER_TEMP/chill-1a.wav"
          TEST_CLASSES="$RUNNER_TEMP/pocket-adx-decoder-test"
          REFERENCE="$RUNNER_TEMP/gamedac.js"
          test -s "$SOURCE"
          mkdir -p "$TEST_CLASSES"
          javac -d "$TEST_CLASSES" \
            app/src/main/java/com/merzkava/pocket/review/PocketAdxDecoder.java \
            test/PocketAdxDecoderTest.java
          java -cp "$TEST_CLASSES" com.merzkava.pocket.review.PocketAdxDecoderTest "$SOURCE" "$OUTPUT"
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/dialersapps/gamedac/74bb983dddc4b574e3b297eca35b15398ce7c497/gamedac.js \
            --output "$REFERENCE"
          test -s "$REFERENCE"
          node test/adx-reference-compare.mjs "$SOURCE" "$OUTPUT" "$REFERENCE"

  native-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true
      - name: Install Android SDK platform, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          NDK_DIR="$SDK_ROOT/ndk/27.2.12479018"
          sdkmanager --install "platforms;android-35" "cmake;3.22.1" "ndk;27.2.12479018"
          test -s "$NDK_DIR/source.properties"
          grep -q "Pkg.Revision = 27.2.12479018" "$NDK_DIR/source.properties"
      - name: Download and verify pinned CRI ADX LE SDK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CRI_SDK_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          SDK_DIR="$RUNNER_TEMP/cri-sdk"
          mkdir -p "$SDK_DIR"
          gh release download cri-sdk-temp --repo Antarezka/open-innovation-lab \
            --pattern "cri_adx2le_sdk_v2.31.01.zip" --dir "$SDK_DIR" --clobber
          ZIP="$SDK_DIR/cri_adx2le_sdk_v2.31.01.zip"
          EXPECTED="a8996d1096ecab760c1fedd5a32a7bcb5013c1894bd555d19c6b33f765ccc5b4"
          echo "$EXPECTED  $ZIP" | sha256sum --check -
          mkdir -p "$SDK_DIR/unpacked"
          unzip -q "$ZIP" -d "$SDK_DIR/unpacked"
          ARM64_LIB="$(find "$SDK_DIR/unpacked" -type f -iname 'libcri_ware_android*le.so' | grep -E '/arm64-v8a/' | head -n1)"
          ARM32_LIB="$(find "$SDK_DIR/unpacked" -type f -iname 'libcri_ware_android*le.so' | grep -E '/armeabi-v7a/' | head -n1)"
          HEADER_FILE="$(find "$SDK_DIR/unpacked" -type f -name 'cri_le_atom_android.h' -print -quit)"
          HEADER_DIR="$(dirname "$HEADER_FILE")"
          echo "CRI Android header: $HEADER_FILE"
          echo "CRI ARM64 library: $ARM64_LIB"
          echo "CRI ARMv7 library: $ARM32_LIB"
          test -n "$ARM64_LIB" && test -s "$ARM64_LIB"
          test -n "$ARM32_LIB" && test -s "$ARM32_LIB"
          test -n "$HEADER_FILE" && test -s "$HEADER_DIR/cri_le_atom_ex.h"
          CRI_ROOT="$SDK_DIR/normalized"
          mkdir -p "$CRI_ROOT/include" "$CRI_ROOT/libs/arm64-v8a" "$CRI_ROOT/libs/armeabi-v7a"
          cp -a "$HEADER_DIR/." "$CRI_ROOT/include/"
          cp "$ARM64_LIB" "$CRI_ROOT/libs/arm64-v8a/libcri_ware_android_le.so"
          cp "$ARM32_LIB" "$CRI_ROOT/libs/armeabi-v7a/libcri_ware_android_LE.so"
          echo "CRI_SDK_ROOT=$CRI_ROOT" >> "$GITHUB_ENV"
      - name: Print pinned CRI SDK header documentation for audio-noise levers
        shell: bash
        continue-on-error: true
        run: |
          set +e
          INC="$CRI_SDK_ROOT/include"
          show() {  # show <label> <regex> <lines-before> <lines-after> <file>
            echo "::group::$1"
            grep -n -B"$3" -A"$4" -E "$2" "$5" | sed -E "s#^#  #" | cut -c1-240
            echo "::endgroup::"
          }
          A="$INC/cri_le_atom_android.h"
          show "ANDROID thread priority (Set/Get)"     'void CRIAPI criAtom_SetThreadPriority_ANDROID|int CRIAPI criAtom_GetThreadPriority_ANDROID' 26 1 "$A"
          show "ANDROID thread priority macros"         'define criAtomEx_(Set|Get)ThreadPriority_ANDROID' 22 2 "$A"
          show "ANDROID AAudio switch"                  'criAtom_EnableAAudio_ANDROID\(' 12 1 "$A"
          show "ANDROID default config macros"          'define criAtomEx_SetDefaultConfig_ANDROID|define criAtomExAsrRack_SetDefaultConfig_ANDROID' 6 16 "$A"
          X="$(grep -rl 'CriAtomExAsrConfigTag' "$INC" | head -n1)"
          show "CriAtomExAsrConfig struct"              'typedef struct CriAtomExAsrConfigTag' 4 90 "$X"
          show "CriAtomExConfig (server_frequency etc.)" 'typedef struct CriAtomExConfigTag' 4 140 "$INC/cri_le_atom_ex.h"
          show "sound renderer type enum"               'CRIATOM_SOUND_RENDERER_DEFAULT' 14 14 "$(grep -rl 'CRIATOM_SOUND_RENDERER_DEFAULT' "$INC" | head -n1)"
          show "ADX voice pool config"                  'typedef struct CriAtomExAdxVoicePoolConfigTag' 4 30 "$INC/cri_le_atom_ex.h"
          show "AdxPlayerConfig (renderer, rate)"       'typedef struct CriAtomAdxPlayerConfigTag' 4 70 "$(grep -rl 'CriAtomAdxPlayerConfigTag' "$INC" | head -n1)"
          show "criAtomExPlayer_SetData"                'criAtomExPlayer_SetData\(' 30 3 "$INC/cri_le_atom_ex.h"
          show "criAtomExPlayer_SetFormat/SamplingRate" 'void CRIAPI criAtomExPlayer_Set(Format|SamplingRate|NumChannels)\(' 22 1 "$INC/cri_le_atom_ex.h"
          show "criAtomExPlayer_SetDataRequestCallback" 'criAtomExPlayer_SetDataRequestCallback\(' 30 3 "$INC/cri_le_atom_ex.h"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Pocket JNI and Java sources without assembling an APK
        working-directory: review-apk
        run: gradle --no-daemon :app:externalNativeBuildDebug :app:compileDebugJavaWithJavac
