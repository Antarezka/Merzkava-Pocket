name: Merzkava Pocket PXL Character Preview

on:
  push:
    branches:
      - art/isometric-pxl-character-v1
      - feat/claude-modular-appearance-expansion-2026-11-08
      - fix/daily-login-japanese-shop-depth-2026-11-08
      - recovery/claude-full-updates-on-build-146-2026-11-09
    paths:
      - "review-apk/art/characters/**"
      - "review-apk/art/world-archive.px.js"
      - "review-apk/art/human-character-base.px.js"
      - "review-apk/art/human-appearance-layers.px.js"
      - "review-apk/scripts/build-world-assets.mjs"
      - "review-apk/web/src/home-base.js"
      - "review-apk/web/src/home-base.css"
      - "review-apk/web/src/economy.js"
      - "review-apk/package.json"
      - "review-apk/vite.config.js"
      - ".github/workflows/pocket-character-preview.yml"

permissions:
  contents: read

jobs:
  render-character-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4

      - name: Set up Node for PXL
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch the official PXL renderer
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/augusto-scarvalho/claude-pxl.git "$RUNNER_TEMP/claude-pxl"

      - name: Render and verify Claude's 5x5 human base and matching accessories
        shell: bash
        run: |
          set -euo pipefail
          PXL="$RUNNER_TEMP/claude-pxl/bin/pxl.js"
          HUMAN_OUT="$RUNNER_TEMP/merzkava-pocket-pxl-preview/human-character"
          ACCESSORY_OUT="$RUNNER_TEMP/merzkava-pocket-pxl-preview/appearance-layers"
          node --check review-apk/web/src/home-base.js
          node --check review-apk/web/src/economy.js
          node "$PXL" build review-apk/art/human-character-base.px.js --out "$HUMAN_OUT" --no-preview
          node "$PXL" build review-apk/art/human-appearance-layers.px.js --out "$ACCESSORY_OUT" --no-preview

          for hair in long_black soft_bob half_up high_tie long_waves; do
            test -s "$HUMAN_OUT/sprites/human_preview_hair_${hair}.png"
          done
          for outfit in black_hanfu ivory_layers jade_scholar rose_ceremony traveller_robe; do
            test -s "$HUMAN_OUT/sprites/human_preview_outfit_${outfit}.png"
          done
          test -s "$HUMAN_OUT/anims/human_long_black_black_hanfu_walk_s.png"
          test -s "$HUMAN_OUT/anims/human_long_waves_traveller_robe_idle_n.png"

          for accessory in jade_pin phoenix_comb cloth_headband scholar_crown round_glasses half_mask bead_tassel forehead_gem moon_veil travel_goggles ribbon_bow earring_chains; do
            test -s "$ACCESSORY_OUT/sprites/human_preview_accessory_${accessory}.png"
          done
          test -s "$ACCESSORY_OUT/anims/accessory_round_glasses_walk_s.png"
          test -s "$ACCESSORY_OUT/anims/accessory_moon_veil_walk_n.png"

          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const checks = [
              [process.env.HUMAN_OUT + "/anims/human_long_black_black_hanfu_walk_s.json", 8],
              [process.env.HUMAN_OUT + "/anims/human_long_waves_traveller_robe_idle_n.json", 4],
              [process.env.ACCESSORY_OUT + "/anims/accessory_round_glasses_walk_s.json", 8],
              [process.env.ACCESSORY_OUT + "/anims/accessory_moon_veil_walk_n.json", 8]
            ];
            for (const [file, expected] of checks) {
              const json = JSON.parse(readFileSync(file, "utf8"));
              if (Object.keys(json.frames || {}).length !== expected) {
                throw new Error(file + " expected " + expected + " frames, got " + Object.keys(json.frames || {}).length);
              }
            }
          '
        env:
          HUMAN_OUT: ${{ runner.temp }}/merzkava-pocket-pxl-preview/human-character
          ACCESSORY_OUT: ${{ runner.temp }}/merzkava-pocket-pxl-preview/appearance-layers

      - name: Build the Pocket web app and verify packaged appearance assets
        shell: bash
        working-directory: review-apk
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build

          for hair in long_black soft_bob half_up high_tie long_waves; do
            test -s "dist/game-assets/pxl/sprites/human_preview_hair_${hair}.png"
          done
          for outfit in black_hanfu ivory_layers jade_scholar rose_ceremony traveller_robe; do
            test -s "dist/game-assets/pxl/sprites/human_preview_outfit_${outfit}.png"
          done
          test -s dist/game-assets/pxl/anims/human_long_black_black_hanfu_walk_s.png
          test -s dist/game-assets/pxl/anims/accessory_round_glasses_walk_s.png
          test -s dist/game-assets/pxl/anims/accessory_moon_veil_walk_n.png
          test ! -e dist/game-assets/pxl/anims/human_braided_crown_azure_artificer_walk_s.png
          test ! -e dist/game-assets/pxl/sprites/human_preview_outfit_iron_guard.png
          test -s dist/index.html

          mkdir -p "$RUNNER_TEMP/merzkava-pocket-pxl-preview/web-build"
          cp -a dist/. "$RUNNER_TEMP/merzkava-pocket-pxl-preview/web-build/"
          du -sh dist

      - name: Upload visual review assets
        uses: actions/upload-artifact@v4
        with:
          name: Merzkava-Pocket-PXL-Character-Preview-${{ github.sha }}
          path: ${{ runner.temp }}/merzkava-pocket-pxl-preview/
          if-no-files-found: error
          retention-days: 30
