name: Merzkava Pocket PXL Character Preview

on:
  push:
    branches:
      - art/isometric-pxl-character-v1
    paths:
      - "review-apk/art/characters/**"
      - "review-apk/art/world-archive.px.js"
      - "review-apk/scripts/build-world-assets.mjs"
      - "review-apk/web/src/home-base.js"
      - ".github/workflows/pocket-character-preview.yml"

permissions:
  contents: read

jobs:
  render-character-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4

      - name: Set up Node for PXL
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch PXL and stage its clothing helper
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/augusto-scarvalho/claude-pxl.git "$RUNNER_TEMP/claude-pxl"
          cp "$RUNNER_TEMP/claude-pxl/lib/characters/dress.px.js" review-apk/art/characters/_pxl-dress.px.js

      - name: Validate and render the complete PXL world archive
        shell: bash
        run: |
          set -euo pipefail
          PXL="$RUNNER_TEMP/claude-pxl/bin/pxl.js"
          OUT="$RUNNER_TEMP/merzkava-pocket-pxl-preview"
          node "$PXL" check review-apk/art/world-archive.px.js
          node "$PXL" build review-apk/art/world-archive.px.js --out "$OUT" --share 4
          test -s "$OUT/anims/classic_idle_s.png"
          test -s "$OUT/anims/classic_walk_s.png"
          node "$PXL" check review-apk/art/characters/base-study/preview.px.js
          node "$PXL" build review-apk/art/characters/base-study/preview.px.js --out "$OUT/character-base-study" --share 4
          test -s "$OUT/character-base-study/anims/base_idle_s.png"
          test -s "$OUT/character-base-study/anims/base_walk_s.png"
          test -s "$OUT/character-base-study/anims/hanfu_idle_s.png"
          test -s "$OUT/character-base-study/anims/hanfu_walk_s.png"
          test -s "$OUT/character-base-study/anims/assassin_idle_s.png"
          test -s "$OUT/character-base-study/anims/assassin_walk_s.png"
          test -s "$OUT/share/classic_idle_s.png"

      - name: Upload visual review assets
        uses: actions/upload-artifact@v4
        with:
          name: Merzkava-Pocket-PXL-Character-Preview-${{ github.sha }}
          path: ${{ runner.temp }}/merzkava-pocket-pxl-preview/
          if-no-files-found: error
          retention-days: 30
