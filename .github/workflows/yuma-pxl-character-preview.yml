name: Merzkava Pocket — Yuma PXL Character Review

on:
  push:
    branches:
      - feat/yuma-ultra-detail-pxl-2026-11-08
    paths:
      - "review-apk/art/characters/**"
      - "review-apk/scripts/build-world-assets.mjs"
      - ".github/workflows/yuma-pxl-character-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-yuma:
    runs-on: ubuntu-latest
    steps:
      - name: Check out character source
        uses: actions/checkout@v4

      - name: Set up PXL-compatible Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Fetch Augusto PXL
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/augusto-scarvalho/claude-pxl.git "$RUNNER_TEMP/claude-pxl"

      - name: Check PXL source syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check review-apk/art/characters/yuma-fox-rig3d.px.js

      - name: Render the single-character eight-perspective PNG
        shell: bash
        run: |
          set -euo pipefail
          PXL="$RUNNER_TEMP/claude-pxl/bin/pxl.js"
          OUT="$RUNNER_TEMP/yuma-pxl-review"
          node "$PXL" build review-apk/art/characters/yuma-fox-rig3d.px.js --out "$OUT" --only yuma_8_perspectives --share 4

          PREVIEW="$(find "$OUT" -type f -name 'yuma_8_perspectives.png' -print -quit)"
          if [ -z "$PREVIEW" ]; then
            echo "::error::Yuma eight-perspective preview sheet was not generated"
            find "$OUT" -type f | sort
            exit 1
          fi
          # Enlarge with nearest-neighbour only; keep every pixel crisp.
          if command -v magick >/dev/null 2>&1; then
            magick "$PREVIEW" -filter point -resize 400% "$RUNNER_TEMP/Yuma-8-Perspectives.png"
          elif command -v convert >/dev/null 2>&1; then
            convert "$PREVIEW" -filter point -resize 400% "$RUNNER_TEMP/Yuma-8-Perspectives.png"
          else
            cp "$PREVIEW" "$RUNNER_TEMP/Yuma-8-Perspectives.png"
          fi
          test -s "$RUNNER_TEMP/Yuma-8-Perspectives.png"
          identify "$RUNNER_TEMP/Yuma-8-Perspectives.png" 2>/dev/null || file "$RUNNER_TEMP/Yuma-8-Perspectives.png"
          find "$OUT" -type f | sort | tee "$RUNNER_TEMP/yuma-pxl-files.txt"
          test -s "$RUNNER_TEMP/yuma-pxl-files.txt"

      - name: Upload the Yuma eight-perspective PNG
        uses: actions/upload-artifact@v4
        with:
          name: Yuma-8-Perspectives-Preview-${{ github.sha }}
          path: ${{ runner.temp }}/Yuma-8-Perspectives.png
          if-no-files-found: error
          retention-days: 30
